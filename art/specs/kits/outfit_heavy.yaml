spritekiln: 1
kit: outfit_heavy
license: CC0-1.0
summary: Heavy knight plate armor with cuirass, gold trim, mirrored shoulder pauldrons, armored tassets, and crested steel helmet
host: base_humanoid
at: pelvis
params:
  helm: true          # include steel knight helmet on host head bone
  visor: false        # false: open-face helm with cheek guards & nasal; true: closed visor with dark T-slit
  crest: 0.16         # crimson plume crest height on helmet (0 disables)
  pauldron_scale: 1.0 # shoulder pauldron scale

host_channels:
  coat: 0
  cloth_sway: 0

materials:
  steel:      {ramp: steel, finish: metal, crease: true, edge_highlight: true}
  armor_dark: {ramp: armor_dark, finish: matte}
  gold:       {ramp: gold, finish: metal, edge_highlight: true}
  cape:       {ramp: cape, finish: matte}
  leather:    {ramp: leather, finish: matte}
  slit:       {ramp: steel, bands: [0, 0], outline: false}

bones:
  cuirass:     {parent: at, pos: [0, 0, 0]}
  tasset_base: {parent: at, rot: "[-(coat + cloth_sway)*0.15, 0, 0]"}
  pauldron_L:  {parent: shoulder_L, pos: [0.03, 0.04, 0], scale: pauldron_scale}
  helm:        {parent: head, pos: [0, 0.0, -0.035]}

parts:
  cuirass:
    material: steel
    space: cuirass
    blend: 0.035
    prims:
      # Sculpted breastplate & backplate with bold chest silhouette
      - ellipsoid: {c: [0, 0.42, 0.01], r: [0.275, 0.17, 0.185]}
      - ellipsoid: {c: [0, 0.22, 0.0], r: [0.21, 0.15, 0.165]}
      - box: {c: [0, 0.45, 0.08], half: [0.16, 0.10, 0.12], round: 0.04}
    paint:
      - material: gold
        stripes: {axis: y, at: [0.54, 0.14], width: 0.045}
      - material: gold
        prims:
          - box: {c: [0, 0.36, 0.16], half: [0.035, 0.12, 0.08]}
          - box: {c: [0, 0.40, 0.16], half: [0.095, 0.032, 0.08]}
  armor_belt:
    material: leather
    space: cuirass
    prims:
      - cylinder: {a: [0, 0.075, 0], b: [0, 0.155, 0], r: 0.225, round: 0.01}
  belt_buckle:
    material: gold
    space: cuirass
    priority: 2
    prims:
      - extrude: {c: [0, 0.115, 0.23], depth: 0.045, profile: {rect: [0.058, 0.052], chamfer: 0.012}}
  tasset_L:
    material: steel
    space: tasset_base
    blend: 0.015
    prims:
      # Layered armored hip plates (mirrored to _R automatically)
      - box: {c: [0.16, -0.08, 0.03], half: [0.095, 0.14, 0.13], rot: [0, 0.2, -0.18], round: 0.025}
    paint:
      - material: gold
        stripes: {axis: y, at: [-0.19], width: 0.04}
  tabard:
    material: armor_dark
    space: tasset_base
    prims:
      # Dark center cloth tabard creating high value contrast between silver tassets
      - box: {c: [0, -0.13, 0.0], half: [0.095, 0.20, 0.155], round: 0.02}
  pauldron_L:
    material: steel
    space: pauldron_L
    blend: 0.02
    prims:
      # Oversized readable knight shoulder armor (mirrored to _R automatically)
      - revolve:
          c: [0.02, 0.02, 0]
          rot: [0, 0, -0.58]
          profile: {bezier: [[-0.175, -0.02], [0, 0.155], [0.175, -0.02], [0, 0.06]]}
    paint:
      - material: gold
        stripes: {axis: y, at: [-0.03], width: 0.045}
  helmet:
    material: steel
    space: helm
    when: helm
    prims:
      # Solid steel dome covering skull & ears completely; cheek/neck flared rim
      - revolve:
          c: [0, 0, 0]
          profile:
            bezier:
              - [0.232, 0.025]
              - [0.222, 0.05]
              - [0.218, 0.075]
              - [0.218, 0.12]
              - [0.218, 0.18]
              - [0.215, 0.37]
              - [0, 0.37]
              - [-0.215, 0.37]
              - [-0.218, 0.18]
              - [-0.218, 0.12]
              - [-0.218, 0.075]
              - [-0.222, 0.05]
              - [-0.232, 0.025]
              - [0, 0.025]
    cut:
      - extrude: {c: "[0, 0.08, 0.27 + 3*visor]", depth: 0.42, profile: {rect: [0.125, 0.15], round: 0.03}}
    paint:
      - material: gold
        stripes: {axis: y, at: [0.06], width: 0.048}
      - material: slit
        prims:
          - box: {c: "[0, 0.195, 0.22 + 3*(1 - visor)]", half: [0.145, 0.03, 0.11]}
          - box: {c: "[0, 0.125, 0.22 + 3*(1 - visor)]", half: [0.026, 0.07, 0.11]}
  helm_nasal:
    material: steel
    space: helm
    when: "helm and not visor"
    prims:
      - extrude:
          c: [0, 0.165, 0.225]
          depth: 0.042
          profile: {polygon: [[-0.024, 0.075], [0.024, 0.075], [0.02, -0.065], [-0.02, -0.065]]}
  helm_crest:
    material: cape
    space: helm
    when: "helm and crest > 0"
    priority: 2
    prims:
      - extrude:
          c: [0, 0, 0]
          rot: [0, 1.5708, 0]
          depth: 0.085
          round: 0.014
          profile:
            bezier:
              - [-0.15, 0.30]
              - "[-0.18, 0.38 + crest*1.25]"
              - "[0, 0.37 + crest]"
              - "[0.23, 0.37 + crest*0.9]"
              - "[0.24 + crest*0.55, 0.13]"
              - [0.16, 0.28]
              - [0, 0.34]
              - [-0.11, 0.30]

sockets:
  helm_top: {bone: helm, offset: "[0, 0.37 + crest, 0]"}
