spritekiln: 1
kit: hair_short
license: CC0-1.0
summary: Dynamic layered short hair with swept bangs, temple locks, and spiky nape tufts that break the spherical silhouette
host: base_humanoid
at: head
params:
  volume: 1.0        # crown fullness (0.7..1.3)
  size: 1.0          # uniform scale around head centre
  spike: 1.0         # tuft length at the crown and nape (0.5..1.4)

materials:
  hair: {ramp: hair, finish: matte}

bones:
  hair: {parent: at, pos: [0, 0.14, 0], scale: size}

parts:
  # Crown mass split into separate parts so inner depth lines read as hair layers
  crown:
    material: hair
    space: hair
    blend: 0.025
    prims:
      - ellipsoid: {c: [0, 0.05, -0.045], r: "[0.13 + 0.025*volume, 0.11 + 0.022*volume, 0.14 + 0.02*volume]", rot: [-0.28, 0, 0]}
  fringe:
    material: hair
    space: hair
    blend: 0.01
    prims:
      # Swept bangs parting slightly left (+x) and cascading across the brow
      - tube: {pts: [[0.04, 0.15, 0.02], [0.00, 0.125, 0.135], [-0.035, 0.045, 0.145]], r: [0.038, 0.015]}
      - tube: {pts: [[-0.02, 0.145, 0.01], [-0.075, 0.11, 0.12], [-0.115, 0.04, 0.105]], r: [0.034, 0.015]}
      - tube: {pts: [[0.06, 0.14, 0.01], [0.10, 0.105, 0.115], [0.12, 0.045, 0.095]], r: [0.032, 0.015]}
  tuft_top:
    material: hair
    space: hair
    blend: 0.015
    prims:
      # Dynamic layered crown locks breaking the circular silhouette naturally
      - tube: {pts: [[0.03, 0.135, -0.02], "[0.10, 0.155 + 0.02*spike, -0.07]", "[0.16, 0.11 + 0.02*spike, -0.13]"], r: [0.042, 0.018]}
      - tube: {pts: [[-0.04, 0.13, -0.03], "[-0.11, 0.145 + 0.02*spike, -0.09]", "[-0.16, 0.095 + 0.02*spike, -0.14]"], r: [0.040, 0.018]}
  lock_L:
    material: hair
    space: hair
    line: false
    prims:
      - tube: {pts: [[0.135, 0.07, -0.02], [0.165, -0.02, 0.01], [0.145, -0.09, 0.025]], r: [0.028, 0.015]}
  nape:
    material: hair
    space: hair
    blend: 0.015
    prims:
      # Three upturned/flared nape locks for crisp profile & back silhouettes
      - tube: {pts: [[0, -0.01, -0.14], "[0, -0.09, -0.19 - 0.02*spike]", "[0, -0.13, -0.22 - 0.03*spike]"], r: [0.055, 0.016]}
      - tube: {pts: [[0.07, 0.0, -0.12], "[0.12, -0.07, -0.16 - 0.02*spike]", "[0.15, -0.10, -0.19 - 0.02*spike]"], r: [0.048, 0.015]}
      - tube: {pts: [[-0.07, 0.0, -0.12], "[-0.12, -0.07, -0.16 - 0.02*spike]", "[-0.15, -0.10, -0.19 - 0.02*spike]"], r: [0.048, 0.015]}
