spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: base_humanoid
extends: humanoid
kind: character
view: topdown
size: 64
directions: 8
palette: fantasy_rpg
camera: {pitch: 38, scale: 0.04, center: [0, 1.04, 0]}
shadow: {rx: 10.5, ry: 3.8, alpha: 120}

brief:
  summary: Shared 2.8-head-tall classic fantasy RPG humanoid base (neutral tunic underlayer, trousers, boots, expressive minimal face). Extended by presets without editing this file.
  head: Stylized large head (1.36x) with soft jaw, gentle chin, minimal face (dark 1x2px eyes only, no nose or mouth), small rounded ears. Hair is provided by swappable hair kits.
  must_keep:
    - Clear 2.8-head-tall proportions with readable eyes in front and 3/4 views
    - Grounded boots with clear separation from trousers
  simplify:
    - No fingers, nose, or mouth details under 2px

# Remove built-in template gear so presets compose cleanly via `use:` kits
remove: [use.sword, use.hair, parts.coat, parts.belt]

materials:
  skin:       {ramp: skin, gamma: 0.75}
  cloth:      {ramp: cloth, finish: matte}
  tunic:      {ramp: tunic, finish: matte}
  cape:       {ramp: cape, finish: matte}
  leather:    {ramp: leather, finish: matte}
  steel:      {ramp: steel, finish: metal, crease: true, edge_highlight: true}
  armor_dark: {ramp: armor_dark, finish: matte}
  gold:       {ramp: gold, finish: metal, edge_highlight: true}
  robe:       {ramp: robe, finish: matte}
  robe_trim:  {ramp: robe_trim, finish: matte}
  hat:        {ramp: hat, finish: matte}
  wood:       {ramp: wood, finish: matte, bands: [2, 5]}
  hair:       {ramp: hair, finish: matte}
  tie:        {ramp: tie, finish: matte}
  magic:      {ramp: magic, emissive: true, band: 4, glow: {color: "#38c0ff", mix: 0.55, radius: 1}}
  ink:        {ramp: ink, emissive: true, band: 0, outline: false}
  fx_tail:    {ramp: fx_tail, emissive: true}
  fx_mid:     {ramp: fx_mid, emissive: true}
  fx_core:    {ramp: fx_core, emissive: true}

channels:
  # Secondary motion channels shared by swappable hair/outfit/weapon kits via host_channels
  cloth_sway: 0
  hair_swing: 0
  hair_sway: 0
  weapon_pitch: 0
  weapon_roll: 0
  shield_guard: 0
  # Default neutral hand stance (keeps arms slightly clear of torso/outfits)
  hand_L: [0.35, 0.08, 0.08]
  hand_R: [0.33, 0.12, 0.14]
  foot_L: [0.13, 0, 0.02]

bones:
  # Adjusted to 2.5-3 head-tall (total ~1.58 world units = ~40-44px at scale 0.04)
  torso_rot:  {parent: root, pos: "[0, 0.75 + bob, 0]", rot: "[lean, twist, roll]"}
  pelvis:     {parent: torso_rot, scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase:   {parent: pelvis, pos: [0, 0.67, 0.02], inherit_rot: false, inherit_scale: false,
               rot: "[lean*0.45, twist, roll]"}
  head:       {parent: headbase, rot: "[head_pitch, head_yaw, 0]", scale: 1.36}
  shoulder_L: {parent: pelvis, pos: [0.27, 0.52, 0.0]}
  hip_L:      {parent: pelvis, pos: [0.12, -0.02, 0.0]}
  sole_L:     {parent: footyaw, at: ankle_L, rot: "[pitch_foot_L, 0.08, 0]"}
  coatbase:   {parent: pelvis, rot: "[-coat*0.25, 0, 0]"}

use:
  - {kit: head, as: head, at: head, with: {width: 1.02, jaw: 0.35, chin: 0.55, nose: 0, ears: 0}}

ik:
  arm_L: {start: shoulder_L, space: torso_rot, target: hand_L, lengths: [0.28, 0.26],
          pole: [0.32, 0.0, -1.0], pole_space: torso_rot, up: [0, 0, 1], joint: elbow_L, end: wrist_L}
  leg_L: {start: hip_L, space: root, target: "foot_L + [0, 0.07, -0.02]", lengths: [0.38, 0.36],
          pole: [0.10, 0, 1.0], pole_space: legyaw, joint: knee_L, end: ankle_L}

parts:
  torso:
    material: cloth
    space: pelvis
    blend: 0.055
    prims:
      - ellipsoid: {c: [0, 0.04, 0], r: [0.185, 0.125, 0.135]}
      - ellipsoid: {c: [0, 0.24, 0], r: [0.175, 0.155, 0.13]}
      - ellipsoid: {c: [0, 0.43, 0], r: [0.24, 0.15, 0.145]}
  neck:
    material: skin
    space: pelvis
    prims:
      - cone: {a: [0, 0.53, 0], b: [0, 0.68, 0.02], r: [0.07, 0.065]}
  eye_L:
    material: ink
    space: head
    prims:
      - extrude: {c: [0.074, 0.122, 0.095], rot: [0, 0.65, 0], depth: 0.036,
                  profile: {rect: [0.016, 0.036], round: 0.006}}
  arm_L:
    material: cloth
    blend: 0.025
    prims:
      - sphere: {c: "@shoulder_L", r: 0.082}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.072, 0.058]}
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.058, 0.048]}
  hand_L:
    material: skin
    space: wrist_L
    prims:
      - sphere: {c: [0, 0, 0.038], r: 0.054}
  leg_L:
    material: cloth
    blend: 0.025
    prims:
      - cone: {a: "@hip_L", b: "@knee_L", r: [0.092, 0.068]}
      - cone: {a: "@knee_L", b: "@ankle_L", r: [0.068, 0.054]}
  boot_L:
    material: leather
    space: sole_L
    blend: 0.025
    prims:
      - cone: {a: [0, 0.11, 0], b: [0, -0.015, 0], r: [0.066, 0.064]}
      - ellipsoid: {c: [0, -0.035, 0.048], r: [0.066, 0.044, 0.108]}

sockets:
  hand_L: {bone: wrist_L}
  hand_R: {bone: wrist_R}
  head_top: {bone: head, offset: [0, 0.34, 0]}

review:
  min_lstar: 22
  keep:
    eyes: {parts: [eye_L, eye_R], min_px: 2, dirs: [s, se, sw]}

timing:
  attack: {hit: 250ms}

animations:
  # 1. Idle: strictly periodic sin/cos(p), 1-2px breathing bob (0.045 units ~1.1px at scale 0.04)
  idle:
    frames: 6
    ms: 160
    channels:
      bob:        "0.045*sin(p)"
      squash:     "1 + 0.02*sin(p)"
      head_pitch: "-0.04*sin(p - 0.5)"
      hand_L:     "[0.35, 0.08 + 0.025*sin(p - 0.6), 0.08]"
      hand_R:     "[0.33, 0.12 + 0.025*sin(p - 0.6), 0.14]"
      coat:       "0.16*sin(p - 0.9)"
      cloth_sway: "0.14*sin(p - 1.0)"
      hair_swing: "0.08*sin(p - 0.8)"
      hair_sway:  "0.05*sin(p - 1.1)"

  # 2. Walk: 8-frame seamless loop (p only), grounded stride with counter-swinging arms & secondary lag
  walk:
    frames: 8
    ms: 100
    events: {0: step_l, 4: step_r}
    channels:
      lean:         0.12
      bob:          "-0.045*cos(2*p) + 0.015"
      twist:        "0.10*cos(p)"
      foot_L:       "[0.13, 0.10*pos(-sin(p)), 0.02 + 0.24*cos(p)]"
      foot_R:       "[0.13, 0.10*pos(sin(p)), 0.02 - 0.24*cos(p)]"
      pitch_foot_L: "0.38*pos(-sin(p))"
      pitch_foot_R: "0.38*pos(sin(p))"
      hand_L:       "[0.35, 0.09 + 0.04*pos(cos(p)), 0.08 - 0.18*cos(p)]"
      hand_R:       "[0.33, 0.12 + 0.04*pos(-cos(p)), 0.14 + 0.16*cos(p)]"
      head_yaw:     "-0.06*cos(p)"
      coat:         "0.45*sin(2*p)"
      cloth_sway:   "0.25 + 0.28*sin(2*p - 0.7)"
      hair_swing:   "0.22 + 0.20*sin(2*p - 0.8)"
      hair_sway:    "0.16*sin(p - 0.5)"

  # 3. Attack: anticipation -> uninterpolated snappy 50ms hit frame with smear arc & squash>1 -> follow-through -> recovery
  # Compatible with both sword+shield and tall arcane staff (kept within 64px bounds without upside-down staff flip)
  attack:
    loop: false
    keys:
      - ms: 100
        set:
          twist: -0.32
          lean: -0.02
          bob: -0.025
          squash: 0.96
          hand_R: [0.38, 0.36, -0.06]
          hand_L: [0.24, 0.22, 0.22]
          foot_L: [0.14, 0, 0.10]
          foot_R: [0.14, 0, -0.06]
          weapon_pitch: -0.25
          shield_guard: 0.3
          coat: -0.25
          cloth_sway: -0.2
          hair_swing: -0.15
      - ms: 150
        event: windup
        set:
          twist: -0.58
          lean: -0.06
          bob: -0.055
          squash: 0.92
          head_pitch: -0.08
          hand_R: [0.40, 0.48, -0.14]
          hand_L: [0.20, 0.26, 0.26]
          foot_L: [0.14, 0, 0.12]
          foot_R: [0.14, 0, -0.08]
          weapon_pitch: -0.45
          shield_guard: 0.45
          coat: -0.4
          cloth_sway: -0.35
          hair_swing: -0.28
      - ms: 50
        event: hit
        set:
          root: [0, 0, 0.08]
          twist: 0.45
          lean: 0.24
          bob: 0.01
          squash: 1.07
          hand_R: [-0.02, 0.26, 0.38]
          hand_L: [0.38, 0.14, 0.06]
          foot_L: [0.14, 0, 0.22]
          foot_R: [0.14, 0, -0.10]
          weapon_pitch: 0.95
          weapon_roll: 0.35
          coat: 0.65
          cloth_sway: 0.65
          hair_swing: 0.45
          hair_sway: -0.30
          smear_r: 0.64
          smear_y: 0.82
          smear_z: 0.16
          smear_a0: -1.35
          smear_a1: 1.05
          smear_w: 0.11
          smear_fade: 1.0
      - ms: 90
        set:
          root: [0, 0, 0.09]
          twist: 0.58
          lean: 0.22
          squash: 1.00
          hand_R: [-0.16, 0.24, 0.30]
          hand_L: [0.38, 0.12, 0.04]
          foot_L: [0.14, 0, 0.22]
          foot_R: [0.14, 0, -0.09]
          weapon_pitch: 0.78
          coat: 0.58
          cloth_sway: 0.85
          hair_swing: 0.68
          hair_sway: -0.40
          smear_r: 0.64
          smear_y: 0.82
          smear_z: 0.16
          smear_a0: 0.10
          smear_a1: 1.25
          smear_w: 0.065
          smear_fade: 0.65
      - ms: 110
        set:
          root: [0, 0, 0.05]
          twist: 0.24
          lean: 0.10
          squash: 0.98
          hand_R: [0.12, 0.14, 0.22]
          hand_L: [0.36, 0.09, 0.06]
          foot_L: [0.13, 0, 0.10]
          foot_R: [0.13, 0, -0.02]
          weapon_pitch: 0.22
          coat: 0.15
          cloth_sway: 0.35
          hair_swing: 0.30
      - ms: 110
        set:
          root: [0, 0, 0.01]
          twist: 0.04
          lean: 0.05
          hand_R: [0.31, 0.12, 0.15]
          hand_L: [0.35, 0.08, 0.08]
          coat: -0.05
          cloth_sway: 0.08
          hair_swing: 0.06

  # 4. Dodge: responsive low-crouch evasive dash step with stretch, trailing weapon/cape/hair, and squash landing
  dodge:
    loop: false
    keys:
      - ms: 50
        event: dodge_start
        set:
          bob: -0.065
          lean: 0.22
          squash: 0.89
          head_pitch: 0.06
          hand_L: [0.24, 0.20, 0.26]
          hand_R: [0.38, 0.10, -0.05]
          foot_L: [0.14, 0, 0.10]
          foot_R: [0.14, 0, -0.10]
          shield_guard: 0.70
          weapon_pitch: -0.30
          coat: 0.25
          cloth_sway: 0.35
          hair_swing: 0.30
      - ms: 65
        event: evade
        set:
          root: [0, 0.02, 0.13]
          bob: -0.03
          lean: 0.36
          twist: 0.20
          squash: 1.06
          head_pitch: -0.06
          hand_L: [0.22, 0.22, 0.30]
          hand_R: [0.40, 0.12, -0.18]
          foot_L: [0.13, 0.10, 0.20]
          foot_R: [0.13, 0.08, -0.22]
          pitch_foot_L: 0.35
          pitch_foot_R: 0.45
          shield_guard: 0.80
          weapon_pitch: -0.40
          coat: 0.75
          cloth_sway: 0.90
          hair_swing: 0.80
      - ms: 75
        set:
          root: [0, 0.01, 0.15]
          bob: -0.035
          lean: 0.30
          twist: 0.15
          squash: 1.03
          hand_L: [0.24, 0.20, 0.26]
          hand_R: [0.38, 0.10, -0.15]
          foot_L: [0.13, 0.04, 0.22]
          foot_R: [0.13, 0.06, -0.18]
          shield_guard: 0.72
          weapon_pitch: -0.32
          coat: 0.80
          cloth_sway: 1.05
          hair_swing: 0.95
      - ms: 90
        event: land
        set:
          root: [0, 0, 0.12]
          bob: -0.055
          lean: 0.16
          twist: 0.06
          squash: 0.92
          hand_L: [0.28, 0.14, 0.18]
          hand_R: [0.35, 0.10, 0.04]
          foot_L: [0.14, 0, 0.14]
          foot_R: [0.14, 0, -0.08]
          shield_guard: 0.35
          weapon_pitch: -0.10
          coat: 0.35
          cloth_sway: 0.50
          hair_swing: 0.45
      - ms: 100
        set:
          root: [0, 0, 0.03]
          bob: -0.01
          lean: 0.07
          squash: 0.98
          hand_L: [0.34, 0.09, 0.10]
          hand_R: [0.33, 0.12, 0.12]
          coat: 0.08
          cloth_sway: 0.12
          hair_swing: 0.10
